name: Build Tauri

on:
  push:
    branches: [master]
    paths:
      - 'launcher-tauri/**'
      - '.github/workflows/build-tauri.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: launcher-tauri/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            launcher-tauri/src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('launcher-tauri/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install frontend dependencies
        working-directory: launcher-tauri
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: launcher-tauri
          releaseId: ${{ github.event.release.id }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-build
          path: |
            launcher-tauri/src-tauri/target/release/bundle/nsis/*.exe
            launcher-tauri/src-tauri/target/release/bundle/msi/*.msi
          retention-days: 7