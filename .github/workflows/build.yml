name: Build AmongApi

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Restore dependencies
        run: dotnet restore "Among API/Among API.csproj"

      - name: Build
        run: dotnet build "Among API/Among API.csproj" --configuration Release --no-restore

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AmongApi
          path: Among API/bin/Release/net6.0/AmongApi.dll
