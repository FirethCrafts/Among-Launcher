name: Build AmongApi

on:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Restore dependencies
        run: dotnet restore "Among API/Among API.csproj"

      - name: Build
        run: dotnet build "Among API/Among API.csproj" --configuration Release --no-restore

      - name: Delete old latest release
        run: |
          gh release delete latest --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          files: Among API/bin/Release/net6.0/AmongApi.dll
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
