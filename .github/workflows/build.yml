name: Build AmongApi

on:
  push:
    branches: [master]
    paths: ['Among API/**']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Bump AmongApi version
        id: bump
        run: |
          # Read current version
          current=$(grep '<Version>' Among\ API/Among\ API.csproj | sed 's/.*<Version>\(.*\)<\/Version>.*/\1/')
          echo "Current version: $current"

          # Increment last number
          major=$(echo $current | cut -d. -f1)
          minor=$(echo $current | cut -d. -f2)
          patch=$(echo $current | cut -d. -f3)
          new_patch=$((patch + 1))
          new_version="$major.$minor.$new_patch"
          echo "New version: $new_version"

          # Update csproj
          sed -i "s|<Version>$current</Version>|<Version>$new_version</Version>|" Among\ API/Among\ API.csproj
          sed -i "s|<FileVersion>$current</FileVersion>|<FileVersion>$new_version</FileVersion>|" Among\ API/Among\ API.csproj

          echo "version=$new_version" >> $GITHUB_OUTPUT

      - name: Commit version bump
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add "Among API/Among API.csproj"
          git diff --staged --quiet || git commit -m "chore: auto-bump AmongApi to ${{ steps.bump.outputs.version }}"
          git push

      - name: Restore dependencies
        run: dotnet restore "Among API/Among API.csproj"

      - name: Build
        run: dotnet build "Among API/Among API.csproj" --configuration Release --no-restore

      - name: Delete old latest release
        run: |
          gh release delete latest --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release with version tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.bump.outputs.version }}
          name: AmongApi v${{ steps.bump.outputs.version }}
          files: Among API/bin/Release/net6.0/AmongApi.dll
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
