[package]
name = "among-launcher"
version = "1.0.0"
description = "Among Launcher"
authors = ["AmongLauncher"]
edition = "2021"

[lib]
name = "among_launcher_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
windows = { version = "0.58", features = ["Win32_System_Registry", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security"] }
dirs = "5"
anyhow = "1"
walkdir = "2"
zip = "2"
futures-util = "0.3"
reqwest = { version = "0.12", features = ["json", "stream"] }
open = "5"
tokio-tungstenite = "0.24"
rand = "0.8"
tokio-util = "0.7"
goblin = "0.10"
sha2 = "0.10"
tempfile = "3"
tiny_http = "0.12"
urlencoding = "2"
